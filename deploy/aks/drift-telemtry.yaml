apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift-v93-telemetry
  labels:
    app: drift-v93
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drift-v93
  template:
    metadata:
      labels:
        app: drift-v93
    spec:
      containers:
        - name: drift-v93
          image: reid/drift:v9.3
          ports:
            - containerPort: 7070
          env:
            - name: CORPUS_DRIFT_CEILING
              value: "0.10"
            - name: CROSS_DOMAIN_DRIFT_CEILING
              value: "0.03"
            - name: EMERGENT_DRIFT_CEILING
              value: "0.05"
            - name: TEMPORAL_DRIFT_CEILING
              value: "0.01"
          resources:
            limits:
              cpu: "400m"
              memory: "256Mi"
            requests:
              cpu: "200m"
              memory: "128Mi"
